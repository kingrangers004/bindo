    <!-- ANTI-BOT SCRIPT -->
    <script type="text/javascript">
        (function() {
            var isBot = false;
            
            // 1. Cek User-Agent
            var ua = navigator.userAgent.toLowerCase();
            var botKeywords = ['bot', 'crawler', 'spider', 'curl', 'wget', 'python', 'postman', 'headless', 'phantomjs', 'selenium', 'puppeteer'];
            for (var i = 0; i < botKeywords.length; i++) {
                if (ua.indexOf(botKeywords[i]) !== -1) {
                    isBot = true;
                    break;
                }
            }

            // 2. Cek fitur Headless Browser (Selenium/Puppeteer)
            if (navigator.webdriver || window.navigator.webdriver) {
                isBot = true;
            }

            // Jika terdeteksi bot, langsung tendang ke Google
            if (isBot) {
                window.location.replace("https://www.google.com");
            }
        })();
    </script>

    <!-- ANTI-DEBUGGER SCRIPT -->
    <script type="text/javascript">
        (function() {
            // 1. Matikan Klik Kanan
            document.addEventListener('contextmenu', function(e) {
                e.preventDefault();
            });

            // 2. Matikan shortcut keyboard untuk Developer Tools
            document.addEventListener('keydown', function(e) {
                // F12
                if (e.keyCode === 123) {
                    e.preventDefault();
                    return false;
                }
                // Ctrl+Shift+I (Inspect)
                if (e.ctrlKey && e.shiftKey && e.keyCode === 73) {
                    e.preventDefault();
                    return false;
                }
                // Ctrl+Shift+J (Console)
                if (e.ctrlKey && e.shiftKey && e.keyCode === 74) {
                    e.preventDefault();
                    return false;
                }
                // Ctrl+Shift+C (Element Inspector)
                if (e.ctrlKey && e.shiftKey && e.keyCode === 67) {
                    e.preventDefault();
                    return false;
                }
                // Ctrl+U (View Source)
                if (e.ctrlKey && e.keyCode === 85) {
                    e.preventDefault();
                    return false;
                }
            });

            // 3. Jebakan Debugger (Membekukan browser jika DevTools terbuka)
            setInterval(function() {
                var before = new Date().getTime();
                debugger;
                var after = new Date().getTime();
                if (after - before > 100) {
                    // Terdeteksi developer tools terbuka karena waktu eksekusi tertahan oleh debugger
                    document.body.innerHTML = "Access Denied";
                    window.location.replace("https://www.google.com");
                }
            }, 1000);
        })();
    </script>

    <script type="text/javascript">
        (function (l) {
            // Redirect logic for /#:id to /:id
            if (l.hash && l.hash.startsWith('#/')) {
                const newPath = l.hash.replace('#', '');
                window.location.replace(newPath); // Redirect to /:id
            }

            // Existing logic for handling search parameters
            if (l.search[1] === "/") {
                var decoded = l.search
                    .slice(1)
                    .split("&")
                    .map(function (s) {
                        return s.replace(/~and~/g, "&");
                    })
                    .join("?");
                window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
            }
        })(window.location);
    </script>
